<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS Externo -->
    <title>Aula Dom</title>
</head>
<body>
    
    <header>
        <h1 id="titulo" class="titulo"> Titulo</h1>
    </header>
    <main>
        <section>
            <p> 
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome"/>
                <button type="submit" onclick="mudar()">Mudar</button>
            </p>
        </section>
        <hr>
        <section>
            <h2>Classificacao Time</h2>
            <p>Primeiro Colocado: <span class="time"></span></p>
            <p>Segundo Colocado: <span class="time"></span></p>
            <p>Terceiro Colocado: <span class="time"></span></p>

            <p>
                <label for="novo">Novo Classificacao</label>
                <input type="text" id="novo" name="novo"/>
            </p>
            <p>
                <label for="posicao">Posicao</label>
                <input type="number" min="1" max="3" id="posicao" name="posicao"/>
            </p>
            <button type="submit" onclick="inserir()">Adicionar Time</button>
        </section>
    </main>

    <!-- Js Externo -->
     <script src="./src/js/script.js"></script>

</body>
</html>
